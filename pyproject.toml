[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[project]
name = "multi-model-api-wrapper"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "anthropic>=0.120.0",
    "google-genai>=2.14.0",
    "groq>=1.6.0",
    "openai>=2.48.0",
    "pytest>=9.1.1",
    "python-dotenv>=1.2.2",
]

[tool.pytest.ini_options]
filterwarnings = [
    "ignore:.*_UnionGenericAlias.*:DeprecationWarning:google.genai.types",
]
